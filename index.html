        <h1>Reece Chevalier</h1>

        <p class="tagline">
            Poems for the things that do not leave cleanly.
        </p>

        <div class="featured-poem">
            <p>
                I have spent years trying to become<br>
                someone who does not look back.<br><br>

                The tragedy is not that I failed.<br>
                The tragedy is that looking back<br>
                was the only honest thing I ever did.
            </p>
        </div>
